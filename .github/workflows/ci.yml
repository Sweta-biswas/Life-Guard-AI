name: LifeGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          # Mock environment variables to ensure compilation passes in CI without actual secrets
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-placeholder"
          GEMINI_API_KEY: "mock-gemini-key-placeholder"
          TELEGRAM_BOT_TOKEN: "mock-telegram-token-placeholder"
